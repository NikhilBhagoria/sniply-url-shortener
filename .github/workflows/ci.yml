name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local stack
        env:
          JWT_SECRET: ci-only-random-fixture-not-a-production-secret-abcdef123456
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke checks
        run: |
          curl --fail http://localhost:5000/api/ready
          curl --fail http://localhost:5173/
      - name: Container status
        if: failure()
        run: docker compose ps
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down
